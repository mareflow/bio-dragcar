<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="index, follow">
  
  <!-- SEO e Redes Sociais (atualizados dinamicamente pelo CONFIG) -->
  <title>Página de Links</title>
  <meta name="description" content="Acesse nossos canais e redes sociais oficiais.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Página de Links">
  <meta property="og:description" content="Acesse nossos canais e redes sociais oficiais.">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Página de Links">
  <meta name="twitter:description" content="Acesse nossos canais e redes sociais oficiais.">
  <meta name="theme-color" id="meta-theme-color" content="#0F1115">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Tipografia do Google Fonts com fallback para fontes do sistema -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       SISTEMA DE DESIGN & VARIÁVEIS CSS (Escala modular de 4px)
       ========================================================================== */
    :root {
      /* Cores padrão (sobrescritas dinamicamente pelo script CONFIG) */
      --cor-principal: #3B82F6;
      --cor-principal-alpha15: rgba(59, 130, 246, 0.15);
      --cor-principal-alpha30: rgba(59, 130, 246, 0.30);
      --cor-fundo: #0F1115;
      --cor-texto: #FFFFFF;
      --cor-destaque-texto: #FFFFFF;
      --cor-borda-card: rgba(255, 255, 255, 0.10);
      --cor-fundo-card: rgba(255, 255, 255, 0.06);

      /* Escala de Espaçamento de 4px */
      --espaco-4: 4px;
      --espaco-8: 8px;
      --espaco-12: 12px;
      --espaco-16: 16px;
      --espaco-24: 24px;
      --espaco-28: 28px;
      --espaco-32: 32px;
      --espaco-40: 40px;

      /* Raios de Arredondamento */
      --raio-sm: 8px;
      --raio-md: 12px;
      --raio-lg: 16px;
      --raio-full: 9999px;

      /* Tipografia */
      --fonte-titulo: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --fonte-corpo: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Animação / Transições */
      --transicao-padrao: 200ms ease-out;
      --curva-suave: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Reset Moderno */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: var(--fonte-corpo);
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* Brilho radial sutil atrás do cabeçalho */
    .bg-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: 380px;
      background: radial-gradient(circle at 50% 110px, var(--cor-principal-alpha15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Barra superior com botão Compartilhar */
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: flex-end;
      padding: var(--espaco-16) var(--espaco-16) 0;
      z-index: 2;
    }

    .btn-compartilhar {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--cor-borda-card);
      color: var(--cor-texto);
      font-family: var(--fonte-corpo);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--raio-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background var(--transicao-padrao), border-color var(--transicao-padrao), transform var(--transicao-padrao);
    }

    .btn-compartilhar:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--cor-principal);
      transform: translateY(-1px);
    }

    .btn-compartilhar:active {
      transform: scale(0.96);
    }

    /* Container Central Principal */
    .app-container {
      width: 100%;
      max-width: 480px;
      padding: var(--espaco-12) var(--espaco-24) 0;
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    /* ==========================================================================
       CABEÇALHO
       ========================================================================== */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: var(--espaco-32);
    }

    /* Envoltório da Logo Circular + Anel SVG */
    .avatar-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--espaco-16);
      /* Animação Cena 1 */
      opacity: 0;
      transform: scale(0.8);
      animation: animarAvatar 600ms var(--curva-suave) forwards;
    }

    /* Envoltório da Logo em Formato Horizontal */
    .logo-wrapper-horizontal {
      width: 100%;
      max-width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--espaco-16);
      /* Animação Cena 1 */
      opacity: 0;
      transform: scale(0.9);
      animation: animarAvatar 600ms var(--curva-suave) forwards;
    }

    .logo-banner-img {
      width: 100%;
      max-width: 270px;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 18px var(--cor-principal-alpha30));
    }

    /* Anel SVG */
    .avatar-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 108px;
      height: 108px;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .avatar-ring circle {
      fill: none;
      stroke: var(--cor-principal);
      stroke-width: 2.5;
      stroke-dasharray: 327;
      stroke-dashoffset: 327;
      stroke-linecap: round;
      /* Animação Cena 2 */
      animation: desenharAnel 900ms var(--curva-suave) forwards;
    }

    /* Conteúdo do Avatar (Imagem ou Iniciais) */
    .avatar-circle {
      width: 102px;
      height: 102px;
      border-radius: var(--raio-full);
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px 10px;
      display: block;
    }

    .avatar-iniciais {
      font-family: var(--fonte-titulo);
      font-size: 32px;
      font-weight: 700;
      color: var(--cor-principal);
      letter-spacing: 0.5px;
    }

    /* Textos do Cabeçalho */
    .header-text {
      opacity: 0;
      transform: translateY(8px);
      /* Animação Cena 3 */
      animation: animarFadeUp 500ms var(--curva-suave) 250ms forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nome-empresa {
      font-family: var(--fonte-titulo);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--cor-texto);
      margin-bottom: 6px;
    }

    .descricao-empresa {
      font-size: 15px;
      font-weight: 400;
      opacity: 0.75;
      max-width: 380px;
      line-height: 1.4;
      margin-bottom: var(--espaco-12);
    }

    /* Status de Horário de Funcionamento */
    .status-horario {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--raio-full);
      opacity: 0.85;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--raio-full);
      flex-shrink: 0;
    }

    .status-dot.aberto {
      background-color: #10B981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.7);
    }

    .status-dot.fechado {
      background-color: #6B7280;
    }

    .status-dot.neutro {
      background-color: var(--cor-principal);
    }

    /* ==========================================================================
       LISTA DE LINKS / BOTÕES
       ========================================================================== */
    .links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--espaco-12);
      width: 100%;
    }

    .link-item {
      width: 100%;
      opacity: 0;
      transform: translateY(16px);
      /* Animação Cena 4 (em cascata) */
      animation: animarFadeUp 500ms var(--curva-suave) calc(320ms + var(--i) * 70ms) forwards;
    }

    .link-btn {
      width: 100%;
      min-height: 60px;
      padding: 14px 18px;
      border-radius: var(--raio-lg);
      background-color: var(--cor-fundo-card);
      border: 1px solid var(--cor-borda-card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--cor-texto);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform var(--transicao-padrao), border-color var(--transicao-padrao), background-color var(--transicao-padrao), box-shadow var(--transicao-padrao);
      position: relative;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      border-color: var(--cor-principal);
      background-color: rgba(255, 255, 255, 0.09);
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    .link-btn:focus-visible {
      outline: 2px solid var(--cor-principal);
      outline-offset: 3px;
    }

    /* Ícone do Botão */
    .link-icone-box {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: var(--raio-md);
      background-color: var(--cor-principal-alpha15);
      color: var(--cor-principal);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color var(--transicao-padrao), transform var(--transicao-padrao);
    }

    .link-icone-box svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    /* Conteúdo textual do botão */
    .link-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .link-titulo {
      font-family: var(--fonte-corpo);
      font-size: 16px;
      font-weight: 600;
      color: inherit;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .link-subtitulo {
      font-size: 13px;
      font-weight: 400;
      opacity: 0.7;
      color: inherit;
      margin-top: 2px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Seta do Botão */
    .link-seta {
      color: inherit;
      opacity: 0.45;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transicao-padrao), opacity var(--transicao-padrao);
      flex-shrink: 0;
    }

    .link-btn:hover .link-seta {
      transform: translateX(4px);
      opacity: 0.9;
    }

    /* Botão em Destaque */
    .link-btn.destaque {
      min-height: 68px;
      background-color: var(--cor-principal);
      color: var(--cor-destaque-texto);
      border-color: transparent;
      box-shadow: 0 4px 18px var(--cor-principal-alpha30);
      /* Pulso sutil contínuo */
      animation: pulsoDestaque 2.8s infinite ease-in-out;
    }

    .link-btn.destaque .link-icone-box {
      background-color: rgba(0, 0, 0, 0.15);
      color: var(--cor-destaque-texto);
    }

    .link-btn.destaque .link-subtitulo {
      opacity: 0.85;
    }

    .link-btn.destaque .link-seta {
      opacity: 0.8;
    }

    .link-btn.destaque:hover {
      background-color: var(--cor-principal);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       REDES SOCIAIS
       ========================================================================== */
    .redes-container {
      margin-top: var(--espaco-28);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--espaco-12);
      flex-wrap: wrap;
      /* Animação Cena 5 */
      opacity: 0;
      animation: animarFade 400ms var(--curva-suave) 700ms forwards;
    }

    .rede-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--raio-full);
      background-color: var(--cor-fundo-card);
      border: 1px solid var(--cor-borda-card);
      color: var(--cor-texto);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform var(--transicao-padrao), border-color var(--transicao-padrao), background-color var(--transicao-padrao), color var(--transicao-padrao);
    }

    .rede-btn svg {
      width: 20px;
      height: 20px;
    }

    .rede-btn:hover {
      transform: translateY(-2px);
      border-color: var(--cor-principal);
      color: var(--cor-principal);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .rede-btn:active {
      transform: scale(0.94);
    }

    .rede-btn:focus-visible {
      outline: 2px solid var(--cor-principal);
      outline-offset: 3px;
    }

    /* ==========================================================================
       RODAPÉ
       ========================================================================== */
    footer {
      margin-top: var(--espaco-40);
      padding-bottom: max(var(--espaco-32), env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.5;
      color: var(--cor-texto);
      /* Animação Cena 5 */
      opacity: 0;
      animation: animarFade 400ms var(--curva-suave) 750ms forwards;
    }

    /* ==========================================================================
       AVISO DE COPIADO (TOAST)
       ========================================================================== */
    .toast-aviso {
      position: fixed;
      bottom: max(var(--espaco-24), env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background-color: rgba(20, 22, 28, 0.94);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: var(--raio-full);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms var(--curva-suave), transform 250ms var(--curva-suave);
      z-index: 100;
      white-space: nowrap;
    }

    .toast-aviso.ativo {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .toast-aviso svg {
      color: #10B981;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       ANIMAÇÕES DE ENTRADA (Apenas transform e opacity)
       ========================================================================== */
    @keyframes animarAvatar {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes desenharAnel {
      from {
        stroke-dashoffset: 327;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes animarFadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes animarFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Pulso sutil do botão destaque */
    @keyframes pulsoDestaque {
      0% {
        box-shadow: 0 4px 18px var(--cor-principal-alpha30), 0 0 0 0 var(--cor-principal-alpha30);
      }
      60% {
        box-shadow: 0 4px 18px var(--cor-principal-alpha30), 0 0 0 8px rgba(0, 0, 0, 0);
      }
      100% {
        box-shadow: 0 4px 18px var(--cor-principal-alpha30), 0 0 0 0 rgba(0, 0, 0, 0);
      }
    }

    /* ==========================================================================
       ACESSIBILIDADE: PREFERS-REDUCED-MOTION
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .avatar-wrapper,
      .logo-wrapper-horizontal,
      .header-text,
      .link-item,
      .redes-container,
      footer {
        opacity: 1 !important;
        transform: none !important;
      }
      .avatar-ring circle {
        stroke-dashoffset: 0 !important;
      }
      .link-btn.destaque {
        animation: none !important;
        box-shadow: 0 4px 18px var(--cor-principal-alpha30);
      }
    }
  </style>

  <!-- Fallback de Segurança caso o JavaScript esteja desativado -->
  <noscript>
    <style>
      .avatar-wrapper, .logo-wrapper-horizontal, .header-text, .link-item, .redes-container, footer {
        opacity: 1 !important;
        transform: none !important;
      }
      .avatar-ring circle { stroke-dashoffset: 0 !important; }
    </style>
  </noscript>
</head>
<body>

  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Container Principal -->
  <main class="app-container">

  <script>
    /* ==========================================================================
       OBJETO DE CONFIGURAÇÃO (Altere apenas este bloco para cada cliente)

      descricao: "Centro Automotivo em Florianópolis • Manutenção e Serviços",
      logo: "logo.png", // Arquivo ou URL da logo

      iniciais: "DC",

      corFundo: "#0A0A0C",     // Preto profundo da marca
      corTexto: "#FFFFFF",     // Branco

    /* ==========================================================================
       FUNÇÕES UTILITÁRIAS & CÁLCULOS DE COR
       ========================================================================== */
    
    // Converte HEX para formato RGBA com opacidade configurada
    function hexParaRgba(hex, alpha) {
      let limpo = hex.replace('#', '');
      if (limpo.length === 3) {
        limpo = limpo.split('').map(c => c + c).join('');
      }
      const r = parseInt(limpo.substring(0, 2), 16) || 0;
      const g = parseInt(limpo.substring(2, 4), 16) || 0;
      const b = parseInt(limpo.substring(4, 6), 16) || 0;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // Calcula a luminância relativa (WCAG) para garantir contraste automático
    function calcularLuminancia(hex) {
      let limpo = hex.replace('#', '');
      if (limpo.length === 3) {
        limpo = limpo.split('').map(c => c + c).join('');
      }
      const r = (parseInt(limpo.substring(0, 2), 16) || 0) / 255;
      const g = (parseInt(limpo.substring(2, 4), 16) || 0) / 255;
      const b = (parseInt(limpo.substring(4, 6), 16) || 0) / 255;

      const [rLin, gLin, bLin] = [r, g, b].map(val => {
        return val <= 0.03928 ? val / 12.92 : Math.pow((val + 0.055) / 1.055, 2.4);
      });

      return 0.2126 * rLin + 0.7152 * gLin + 0.0722 * bLin;
    }

    // Retorna texto escuro ou claro conforme o fundo para contraste legível
    function obterCorContraste(hexFundo) {
      const lum = calcularLuminancia(hexFundo);
      return lum > 0.45 ? '#0F1115' : '#FFFFFF';
    }

    // Configura o Favicon oficial (imagem da logo ou SVG dinâmico)
    function gerarFavicon(iniciais, cor) {
      const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
      link.rel = 'shortcut icon';
      const caminhoFavicon = CONFIG.favicon || CONFIG.logo;
      if (caminhoFavicon && caminhoFavicon.trim() !== '') {
        link.type = 'image/png';
        link.href = caminhoFavicon;
      } else {
        const corTexto = obterCorContraste(cor);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="${cor}"/>
          <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="${corTexto}" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28">${iniciais}</text>
        </svg>`;
        link.type = 'image/svg+xml';
        link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
      }
      document.head.appendChild(link);
    }

    // Verifica se a empresa está aberta conforme o horário de Brasília (America/Sao_Paulo)
    function checarStatusAberto(expediente) {
      if (!expediente || !Array.isArray(expediente.dias)) return null;
      try {
        const agoraSp = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Sao_Paulo" }));
        const diaSemana = agoraSp.getDay();
        const horaDecimal = agoraSp.getHours() + (agoraSp.getMinutes() / 60);

        const diaAtivo = expediente.dias.includes(diaSemana);
        const horarioAtivo = horaDecimal >= expediente.abertura && horaDecimal < expediente.fechamento;

        return diaAtivo && horarioAtivo;
      } catch (err) {
        return null;
      }
    }

    // Função reservada para rastreamento de cliques (Analytics / Pixel / Webhook)
    function aoClicar(link) {
      /*
       * Exemplo de integração com Google Analytics ou Meta Pixel:
       * if (typeof gtag === 'function') {
       *   gtag('event', 'click_bio_link', { event_label: link.titulo, url: link.url });
       * }
       * if (typeof fbq === 'function') {
       *   fbq('trackCustom', 'CliqueLinkBio', { titulo: link.titulo, destino: link.url });
       * }
       */
    }

    // Exibe notificação acessível estilo Toast
    let toastTimeout = null;
    function exibirToast(mensagem) {
      const toast = document.getElementById("toast-aviso");
      const msgSpan = document.getElementById("toast-mensagem");
      if (!toast || !msgSpan) return;

      msgSpan.textContent = mensagem;
      toast.classList.add("ativo");

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("ativo");
      }, 2000);
    }

    // Manipula o botão de compartilhar (Web Share API ou Copiar Link)
    async function compartilhar() {
      const dadosCompartilhamento = {
        title: CONFIG.nome,
        text: CONFIG.descricao,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(dadosCompartilhamento);
        } catch (err) {
          if (err.name !== 'AbortError') {
            copiarUrlAtual();
          }
        }
      } else {
        copiarUrlAtual();
      }
    }

    function copiarUrlAtual() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          exibirToast("Link copiado para a área de transferência!");
        }).catch(() => {
          fallbackCopiar();
        });
      } else {
        fallbackCopiar();
      }
    }

    function fallbackCopiar() {
      const inputTemporario = document.createElement("input");
      inputTemporario.value = window.location.href;
      document.body.appendChild(inputTemporario);
      inputTemporario.select();
      try {
        document.execCommand("copy");
        exibirToast("Link copiado para a área de transferência!");
      } catch (e) {
        exibirToast("Não foi possível copiar o link.");
      }
      document.body.removeChild(inputTemporario);
    }

    /* ==========================================================================
       MONTAGEM DINÂMICA DA PÁGINA
       ========================================================================== */
    function montarPagina() {
      // 1. Aplica Cores e Variáveis Dinâmicas no :root
      const root = document.documentElement;
      root.style.setProperty('--cor-principal', CONFIG.corPrincipal);
      root.style.setProperty('--cor-principal-alpha15', hexParaRgba(CONFIG.corPrincipal, 0.15));
      root.style.setProperty('--cor-principal-alpha30', hexParaRgba(CONFIG.corPrincipal, 0.30));
      root.style.setProperty('--cor-fundo', CONFIG.corFundo);
      root.style.setProperty('--cor-texto', CONFIG.corTexto);
      
      const corTextoDestaque = obterCorContraste(CONFIG.corPrincipal);
      root.style.setProperty('--cor-destaque-texto', corTextoDestaque);

      // Meta theme-color e Favicon
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', CONFIG.corFundo);
      gerarFavicon(CONFIG.iniciais || CONFIG.nome.substring(0, 2).toUpperCase(), CONFIG.corPrincipal);

      // Metadados SEO
      document.title = `${CONFIG.nome} | Links`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', CONFIG.descricao);
      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', CONFIG.nome);
      const ogDesc = document.querySelector('meta[property="og:description"]');
      if (ogDesc) ogDesc.setAttribute('content', CONFIG.descricao);

      // 2. Renderiza Cabeçalho
      const headerContainer = document.getElementById("header-container");
      
      // Avatar / Logo: Formato Horizontal, Circular ou Iniciais
      const temLogo = CONFIG.logo && CONFIG.logo.trim() !== "";
      const ehHorizontal = CONFIG.formatoLogo === "horizontal";
      let logoHtml = "";

      if (temLogo) {
        if (ehHorizontal) {
          logoHtml = `
            <div class="logo-wrapper-horizontal">
              <img src="${CONFIG.logo}" alt="Logo de ${CONFIG.nome}" class="logo-banner-img" width="217" height="85">
            </div>
          `;
        } else {
          logoHtml = `
            <div class="avatar-wrapper">
              <svg class="avatar-ring" viewBox="0 0 108 108" aria-hidden="true">
                <circle cx="54" cy="54" r="52"></circle>
              </svg>
              <div class="avatar-circle">
                <img src="${CONFIG.logo}" alt="Logo de ${CONFIG.nome}" class="avatar-img" width="102" height="102">
              </div>
            </div>
          `;
        }
      } else {
        logoHtml = `
          <div class="avatar-wrapper">
            <svg class="avatar-ring" viewBox="0 0 108 108" aria-hidden="true">
              <circle cx="54" cy="54" r="52"></circle>
            </svg>
            <div class="avatar-circle">
              <span class="avatar-iniciais">${CONFIG.iniciais || CONFIG.nome.substring(0, 2).toUpperCase()}</span>
            </div>
          </div>
        `;
      }

      // Status de Horário
      const statusAberto = checarStatusAberto(CONFIG.expediente);
      let statusHtml = '';
      if (CONFIG.horario && CONFIG.horario.trim() !== '') {
        if (statusAberto === true) {
          statusHtml = `<div class="status-horario" title="Horário de Brasília"><span class="status-dot aberto" aria-hidden="true"></span><span>Aberto agora • ${CONFIG.horario}</span></div>`;
        } else if (statusAberto === false) {
          statusHtml = `<div class="status-horario" title="Horário de Brasília"><span class="status-dot fechado" aria-hidden="true"></span><span>Fechado agora • ${CONFIG.horario}</span></div>`;
        } else {
          statusHtml = `<div class="status-horario"><span class="status-dot neutro" aria-hidden="true"></span><span>${CONFIG.horario}</span></div>`;
        }
      }

      headerContainer.innerHTML = `
        ${logoHtml}
        <div class="header-text">
          <h1 class="nome-empresa">${CONFIG.nome}</h1>
          <p class="descricao-empresa">${CONFIG.descricao}</p>
          ${statusHtml}
        </div>
      `;

      // 3. Monta Link do WhatsApp padronizado
      let numeroWhatsappLimpo = (CONFIG.whatsapp && CONFIG.whatsapp.numero) ? CONFIG.whatsapp.numero.replace(/\D/g, '') : '';
      if (numeroWhatsappLimpo.length === 10 || numeroWhatsappLimpo.length === 11) {
        numeroWhatsappLimpo = '55' + numeroWhatsappLimpo;
      }
      const urlWhatsappAuto = numeroWhatsappLimpo
        ? `https://wa.me/${numeroWhatsappLimpo}?text=${encodeURIComponent(CONFIG.whatsapp.mensagem || '')}`
        : '';

      // 4. Renderiza Lista de Links
      const linksContainer = document.getElementById("links-container");
      let linksHtml = '';
      let contadorValidos = 0;

      if (Array.isArray(CONFIG.links)) {
        CONFIG.links.forEach((item) => {
          let urlDestino = (item.url || '').trim();

          // Se for link de WhatsApp e estiver com URL vazia, usa o gerador automático
          if (!urlDestino && (item.icone === 'whatsapp' || item.destaque)) {
            urlDestino = urlWhatsappAuto;
          }

          // Se continuar sem URL válida, pula a renderização
          if (!urlDestino) return;

          const iconeSvg = ICONES[item.icone] || ICONES.site;
          const classeDestaque = item.destaque ? 'destaque' : '';
          const subtituloHtml = item.subtitulo ? `<span class="link-subtitulo">${item.subtitulo}</span>` : '';
          const indiceAnimacao = contadorValidos++;

          linksHtml += `
            <li class="link-item" style="--i: ${indiceAnimacao};">
              <a href="${urlDestino}" class="link-btn ${classeDestaque}" target="_blank" rel="noopener noreferrer" data-titulo="${item.titulo}">
                <div class="link-icone-box" aria-hidden="true">${iconeSvg}</div>
                <div class="link-info">
                  <span class="link-titulo">${item.titulo}</span>
                  ${subtituloHtml}
                </div>
                <div class="link-seta" aria-hidden="true">${ICONES.seta}</div>
              </a>
            </li>
          `;
        });
      }
      linksContainer.innerHTML = linksHtml;

      // Event listener para contabilidade de cliques
      linksContainer.querySelectorAll('.link-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          aoClicar({
            titulo: btn.getAttribute('data-titulo'),
            url: btn.getAttribute('href')
          });
        });
      });

      // 5. Renderiza Redes Sociais
      const redesContainer = document.getElementById("redes-container");
      let redesHtml = '';

      if (Array.isArray(CONFIG.redes)) {
        CONFIG.redes.forEach(rede => {
          const urlRede = (rede.url || '').trim();
          if (!urlRede) return; // Não renderiza se a url estiver vazia

          const iconeRede = ICONES[rede.tipo] || ICONES.site;
          const nomeRede = rede.tipo ? (rede.tipo.charAt(0).toUpperCase() + rede.tipo.slice(1)) : 'Rede Social';

          redesHtml += `
            <a href="${urlRede}" class="rede-btn" target="_blank" rel="noopener noreferrer" aria-label="Acessar nosso canal no ${nomeRede}" data-tipo="${rede.tipo}">
              ${iconeRede}
            </a>
          `;
        });
      }
      redesContainer.innerHTML = redesHtml;

      // 6. Renderiza Rodapé
      const rodapeContainer = document.getElementById("rodape-container");
      const anoAtual = new Date().getFullYear().toString();
      const textoRodape = (CONFIG.rodape || `© [ANO] ${CONFIG.nome}`)
        .replace('[ANO]', anoAtual)
        .replace('[NOME DA EMPRESA]', CONFIG.nome);
      rodapeContainer.textContent = textoRodape;

      // 7. Configura Botão de Compartilhar
      const btnComp = document.getElementById("btn-compartilhar");
      if (btnComp) {
        btnComp.addEventListener("click", compartilhar);
      }
    }

    // Inicializa a montagem quando o DOM estiver pronto
    document.addEventListener("DOMContentLoaded", montarPagina);
  </script>
